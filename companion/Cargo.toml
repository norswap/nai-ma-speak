[package]
name = "translate-companion"
version = "0.3.0"
edition = "2021"
description = "Reads the WoW chat log, translates Chinese chat to English, and shows it in an overlay."
license = "MIT"

[dependencies]
# glow: its Windows path keeps child viewports transparent; wgpu often falls back to opaque.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
arboard = "3.6"
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9"
log = "0.4"
# The picture of an unreadable strip, as text in a report.
base64 = "0.22"
ferrous-opencc = "0.4"
# Unpacks a release's addon, and on macOS its app, for updating.
zip = { version = "9", default-features = false, features = ["deflate"] }

# The window list with layers, to tell whether another window covers the overlay.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
# Whether the app is the active one, to bring its window back on a click on its Dock icon.
objc2 = "0.6"
# And the mouse wheel over the overlay, which the game reports only in part.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSEvent", "block2", "objc2-core-foundation", "objc2-core-graphics"] }
block2 = "0.6"

[profile.release]
opt-level = 3
strip = true

[build-dependencies]
winresource = "0.1"
