[package]
name = "translate-companion"
version = "0.1.0"
edition = "2021"
description = "Reads the WoW chat log, translates Chinese chat to English, and shows it in an overlay."
license = "MIT"

[dependencies]
# glow: its Windows path keeps child viewports transparent; wgpu often falls back to opaque.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
arboard = "3.6"
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9"
log = "0.4"
ferrous-opencc = "0.4"

# The window list with layers, to tell whether another window covers the overlay.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
# Whether the app is the active one, to bring its window back on a click on its Dock icon.
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }

[profile.release]
opt-level = 3
strip = true

[build-dependencies]
winresource = "0.1"
